version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartpos_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: smartpos_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: smartpos_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smart_pos
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-for-xerexlabs-smart-pos-development-2026
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: smartpos_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
